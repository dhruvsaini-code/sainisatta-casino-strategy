name: sainisatta CI Suite

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  test:
    name: Test & Validate Engine
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Python Unit Tests
        run: |
          python -m unittest discover -v tests

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate JavaScript Syntax
        run: |
          node -c app.js
          node -c js/ai_predictor.js
          node -c js/bankroll.js
          node -c js/blackjack.js
          node -c js/roulette.js
          node -c js/baccarat.js
          node -c js/poker.js
          node -c js/craps.js
          node -c js/limbo.js
          node -c js/crash.js
          node -c js/mines.js
          node -c js/vision.js
          node -c chrome-extension/popup.js
          node -c chrome-extension/background.js
          node -c chrome-extension/content.js

      - name: Validate Chrome Extension Manifest
        run: |
          python -c "import json; json.load(open('chrome-extension/manifest.json'))"
